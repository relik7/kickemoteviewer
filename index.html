<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Emote Browser</title>
<style>
  :root {
    --kick-green: #53FC18;
    --bg: #0e0e10;
    --panel: #18181b;
    --border: #2a2a2e;
    --text: #f2f2f2;
    --text-dim: #9a9a9e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 1300px;
    margin: 0 auto 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--kick-green); }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .tabs {
    max-width: 1300px;
    margin: 20px auto 16px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .tab-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--kick-green);
    color: #0e0e10;
    border-color: var(--kick-green);
    font-weight: 600;
  }

  .controls {
    max-width: 1300px;
    margin: 0 auto 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls.hidden { display: none; }

  button.nav {
    background: #232326;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button.nav:hover { border-color: var(--kick-green); }
  button.nav:disabled { opacity: 0.4; cursor: default; }

  .page-field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .page-field input {
    width: 80px;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0e0e10;
    color: var(--text);
    font-size: 0.9rem;
  }
  .page-field button {
    background: #232326;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .range-label {
    color: var(--text-dim);
    font-size: 0.85rem;
    min-width: 140px;
    text-align: center;
  }

  #randomBtn {
    background: var(--kick-green);
    border: 1px solid var(--kick-green);
    color: #0e0e10;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  button.nav.accent {
    background: transparent;
    border: 1px solid var(--kick-green);
    color: var(--kick-green);
  }
  button.nav.accent:hover { background: rgba(83, 252, 24, 0.1); }

  .page-field button.share-btn {
    background: transparent;
    border: 1px solid var(--kick-green);
    color: var(--kick-green);
  }
  .page-field button.share-btn:hover { background: rgba(83, 252, 24, 0.1); }

  .grid {
    max-width: 1300px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tile .img-wrap {
    position: relative;
    width: 64px;
    height: 64px;
  }
  .tile img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    image-rendering: pixelated;
    background: #0e0e10;
    border-radius: 6px;
    cursor: pointer;
  }
  .tile .id {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .tile.broken img { opacity: 0.15; }
  .tile.broken .id { color: #5a3030; }

  .copy-overlay {
    position: absolute;
    inset: 0;
    background: rgba(83, 252, 24, 0.92);
    color: #0e0e10;
    font-size: 0.62rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .copy-overlay.show {
    opacity: 1;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--kick-green);
    color: #0e0e10;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #zoomOverlay {
    position: fixed;
    z-index: 1000;
    background: var(--panel);
    border: 2px solid var(--kick-green);
    border-radius: 12px;
    padding: 10px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #zoomOverlay.show {
    display: flex;
    opacity: 1;
    transform: scale(1);
  }
  #zoomOverlay img {
    width: 192px;
    height: 192px;
    object-fit: contain;
    image-rendering: pixelated;
    background: #0e0e10;
    border-radius: 8px;
    cursor: pointer;
  }
  #zoomOverlay .id {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <h1>Kick <span>Emote</span> Browser</h1>
  <p>Browse emotes by ID, or shuffle through random ones from the full range.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabBrowse" onclick="switchMode('browse')">Browse by page</button>
  <button class="tab-btn" id="tabRandom" onclick="switchMode('random')">Random</button>
</div>

<div class="controls" id="browseControls">
  <button class="nav accent" id="randomPageBtn" onclick="jumpToRandomPage()">Random page</button>
  <button class="nav" id="backBtn" onclick="changePage(-1)">&larr; Back 50</button>
  <span class="range-label" id="rangeLabel">1 &ndash; 50</span>
  <button class="nav" id="forwardBtn" onclick="changePage(1)">Forward 50 &rarr;</button>
  <div class="page-field">
    <label for="pageInput">Page #</label>
    <input type="number" id="pageInput" min="1" value="1">
    <button onclick="goToPage()">Go</button>
    <button class="share-btn" onclick="sharePage()">Share</button>
  </div>
</div>

<div class="controls hidden" id="randomControls">
  <button id="randomBtn" onclick="renderRandom()">Shuffle new set of 50</button>
</div>

<div class="grid" id="grid"></div>
<div id="toast"></div>
<div id="zoomOverlay">
  <img id="zoomImg" src="" alt="">
  <div class="id" id="zoomId"></div>
</div>

<script>
  const MAX_ID = 6000000;
  const PAGE_SIZE = 50;
  let mode = 'browse';
  let currentPage = 1;

  const MAX_PAGE = Math.floor(MAX_ID / PAGE_SIZE);

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // fallback for non-secure contexts / older browsers
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        resolve();
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  const ZOOM_SIZE = 192;
  const HOVER_DELAY = 500;
  const zoomOverlay = document.getElementById('zoomOverlay');
  const zoomImg = document.getElementById('zoomImg');
  const zoomId = document.getElementById('zoomId');
  let hideZoomTimer = null;

  function positionZoom(rect) {
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let left = centerX - ZOOM_SIZE / 2;
    let top = centerY - ZOOM_SIZE / 2;
    const margin = 8;
    left = Math.max(margin, Math.min(left, window.innerWidth - ZOOM_SIZE - margin));
    top = Math.max(margin, Math.min(top, window.innerHeight - ZOOM_SIZE - 40 - margin));
    zoomOverlay.style.left = `${left}px`;
    zoomOverlay.style.top = `${top}px`;
  }

  function showZoom(url, id, rect) {
    clearTimeout(hideZoomTimer);
    zoomImg.src = url;
    zoomImg.alt = `Emote ${id}`;
    zoomId.textContent = id;
    positionZoom(rect);
    zoomOverlay.classList.add('show');
  }

  function scheduleHideZoom() {
    clearTimeout(hideZoomTimer);
    hideZoomTimer = setTimeout(() => zoomOverlay.classList.remove('show'), 80);
  }

  zoomOverlay.addEventListener('mouseenter', () => clearTimeout(hideZoomTimer));
  zoomOverlay.addEventListener('mouseleave', scheduleHideZoom);
  zoomImg.addEventListener('click', () => {
    copyText(zoomImg.src).then(() => showToast('Image URL copied to clipboard'))
      .catch(() => showToast('Could not copy image URL'));
  });

  function emoteTile(id) {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';

    const url = `https://files.kick.com/emotes/${id}/fullsize`;
    const img = document.createElement('img');
    img.src = url;
    img.alt = `Emote ${id}`;
    img.loading = 'lazy';
    img.onerror = () => tile.classList.add('broken');

    const overlay = document.createElement('div');
    overlay.className = 'copy-overlay';
    overlay.textContent = 'Copied!';

    img.addEventListener('click', () => {
      copyText(url).then(() => {
        overlay.classList.add('show');
        setTimeout(() => overlay.classList.remove('show'), 2000);
        showToast('Image URL copied to clipboard');
      }).catch(() => {
        showToast('Could not copy image URL');
      });
    });

    let hoverTimer = null;
    img.addEventListener('mouseenter', () => {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => {
        showZoom(url, id, img.getBoundingClientRect());
      }, HOVER_DELAY);
    });
    img.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer);
      scheduleHideZoom();
    });

    wrap.appendChild(img);
    wrap.appendChild(overlay);

    const label = document.createElement('div');
    label.className = 'id';
    label.textContent = id;

    tile.appendChild(wrap);
    tile.appendChild(label);
    return tile;
  }

  function renderGrid(ids) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ids.forEach(id => grid.appendChild(emoteTile(id)));
  }

  function updateHash() {
    history.replaceState(null, '', `#page=${currentPage}`);
  }

  function renderBrowse() {
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end = currentPage * PAGE_SIZE;
    document.getElementById('rangeLabel').textContent = `${start} \u2013 ${end}`;
    document.getElementById('pageInput').value = currentPage;
    document.getElementById('backBtn').disabled = currentPage <= 1;
    updateHash();
    const ids = [];
    for (let i = start; i <= end; i++) ids.push(i);
    renderGrid(ids);
  }

  function changePage(delta) {
    currentPage = Math.max(1, currentPage + delta);
    renderBrowse();
  }

  function goToPage() {
    const val = parseInt(document.getElementById('pageInput').value, 10);
    currentPage = Math.max(1, isNaN(val) ? 1 : val);
    renderBrowse();
  }

  function jumpToRandomPage() {
    currentPage = Math.floor(Math.random() * MAX_PAGE) + 1;
    renderBrowse();
  }

  function sharePage() {
    const url = `${location.origin}${location.pathname}#page=${currentPage}`;
    copyText(url).then(() => {
      showToast('Link to this page copied to clipboard');
    }).catch(() => {
      showToast('Could not copy link');
    });
  }

  function pageFromHash() {
    const match = location.hash.match(/page=(\d+)/);
    if (match) {
      const val = parseInt(match[1], 10);
      if (!isNaN(val) && val >= 1) return val;
    }
    return null;
  }

  function renderRandom() {
    const ids = new Set();
    while (ids.size < PAGE_SIZE) {
      ids.add(Math.floor(Math.random() * MAX_ID) + 1);
    }
    renderGrid([...ids]);
  }

  function switchMode(newMode) {
    mode = newMode;
    document.getElementById('tabBrowse').classList.toggle('active', mode === 'browse');
    document.getElementById('tabRandom').classList.toggle('active', mode === 'random');
    document.getElementById('browseControls').classList.toggle('hidden', mode !== 'browse');
    document.getElementById('randomControls').classList.toggle('hidden', mode !== 'random');

    if (mode === 'browse') renderBrowse();
    else renderRandom();
  }

  let pageInputTimer = null;
  document.getElementById('pageInput').addEventListener('input', () => {
    clearTimeout(pageInputTimer);
    pageInputTimer = setTimeout(() => {
      goToPage();
    }, 250);
  });

  // initial render: honor #page={num} in the URL if present
  const hashPage = pageFromHash();
  if (hashPage) currentPage = hashPage;
  renderBrowse();

  // keep in sync if the hash changes while the page is open (e.g. back/forward, manual edit)
  window.addEventListener('hashchange', () => {
    const p = pageFromHash();
    if (p && p !== currentPage) {
      currentPage = p;
      if (mode !== 'browse') switchMode('browse');
      else renderBrowse();
    }
  });
</script>

</body>
</html>
