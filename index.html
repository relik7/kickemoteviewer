<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Emote Browser</title>
<style>
  :root {
    --kick-green: #53FC18;
    --bg: #0e0e10;
    --panel: #18181b;
    --border: #2a2a2e;
    --text: #f2f2f2;
    --text-dim: #9a9a9e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--kick-green); }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .tabs {
    max-width: 1100px;
    margin: 20px auto 16px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .tab-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--kick-green);
    color: #0e0e10;
    border-color: var(--kick-green);
    font-weight: 600;
  }

  .controls {
    max-width: 1100px;
    margin: 0 auto 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls.hidden { display: none; }

  button.nav {
    background: #232326;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button.nav:hover { border-color: var(--kick-green); }
  button.nav:disabled { opacity: 0.4; cursor: default; }

  .page-field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .page-field input {
    width: 80px;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0e0e10;
    color: var(--text);
    font-size: 0.9rem;
  }
  .page-field button {
    background: #232326;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .range-label {
    color: var(--text-dim);
    font-size: 0.85rem;
    min-width: 140px;
    text-align: center;
  }

  #randomBtn {
    background: var(--kick-green);
    border: 1px solid var(--kick-green);
    color: #0e0e10;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tile img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    image-rendering: pixelated;
    background: #0e0e10;
    border-radius: 6px;
  }
  .tile .id {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .tile.broken img { opacity: 0.15; }
  .tile.broken .id { color: #5a3030; }
</style>
</head>
<body>

<header>
  <h1>Kick <span>Emote</span> Browser</h1>
  <p>Browse emotes by ID, or shuffle through random ones from the full range.</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabBrowse" onclick="switchMode('browse')">Browse by page</button>
  <button class="tab-btn" id="tabRandom" onclick="switchMode('random')">Random</button>
</div>

<div class="controls" id="browseControls">
  <button class="nav" id="backBtn" onclick="changePage(-1)">&larr; Back 50</button>
  <span class="range-label" id="rangeLabel">1 &ndash; 50</span>
  <button class="nav" id="forwardBtn" onclick="changePage(1)">Forward 50 &rarr;</button>
  <div class="page-field">
    <label for="pageInput">Page #</label>
    <input type="number" id="pageInput" min="1" value="1">
    <button onclick="goToPage()">Go</button>
  </div>
</div>

<div class="controls hidden" id="randomControls">
  <button id="randomBtn" onclick="renderRandom()">Shuffle new set of 50</button>
</div>

<div class="grid" id="grid"></div>

<script>
  const MAX_ID = 6000000;
  const PAGE_SIZE = 50;
  let mode = 'browse';
  let currentPage = 1;

  function emoteTile(id) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const img = document.createElement('img');
    img.src = `https://files.kick.com/emotes/${id}/fullsize`;
    img.alt = `Emote ${id}`;
    img.loading = 'lazy';
    img.onerror = () => tile.classList.add('broken');
    const label = document.createElement('div');
    label.className = 'id';
    label.textContent = id;
    tile.appendChild(img);
    tile.appendChild(label);
    return tile;
  }

  function renderGrid(ids) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ids.forEach(id => grid.appendChild(emoteTile(id)));
  }

  function renderBrowse() {
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end = currentPage * PAGE_SIZE;
    document.getElementById('rangeLabel').textContent = `${start} \u2013 ${end}`;
    document.getElementById('pageInput').value = currentPage;
    document.getElementById('backBtn').disabled = currentPage <= 1;
    const ids = [];
    for (let i = start; i <= end; i++) ids.push(i);
    renderGrid(ids);
  }

  function changePage(delta) {
    currentPage = Math.max(1, currentPage + delta);
    renderBrowse();
  }

  function goToPage() {
    const val = parseInt(document.getElementById('pageInput').value, 10);
    currentPage = Math.max(1, isNaN(val) ? 1 : val);
    renderBrowse();
  }

  function renderRandom() {
    const ids = new Set();
    while (ids.size < PAGE_SIZE) {
      ids.add(Math.floor(Math.random() * MAX_ID) + 1);
    }
    renderGrid([...ids]);
  }

  function switchMode(newMode) {
    mode = newMode;
    document.getElementById('tabBrowse').classList.toggle('active', mode === 'browse');
    document.getElementById('tabRandom').classList.toggle('active', mode === 'random');
    document.getElementById('browseControls').classList.toggle('hidden', mode !== 'browse');
    document.getElementById('randomControls').classList.toggle('hidden', mode !== 'random');

    if (mode === 'browse') renderBrowse();
    else renderRandom();
  }

  // initial render
  renderBrowse();
</script>

</body>
</html>
